name: Build redbull non-KSU kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-redbull-nonksu.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev lld llvm make python3 rsync unzip zip zstd

      - name: Disable KSU references and config
        shell: bash
        run: |
          cp arch/arm64/configs/redbull_defconfig arch/arm64/configs/redbull_defconfig.bak
          cp drivers/Kconfig drivers/Kconfig.bak
          cp drivers/Makefile drivers/Makefile.bak
          sed -i 's/^CONFIG_KSU=y$/# CONFIG_KSU is not set/' arch/arm64/configs/redbull_defconfig
          sed -i 's/^CONFIG_KSU_SUSFS=y$/# CONFIG_KSU_SUSFS is not set/' arch/arm64/configs/redbull_defconfig
          sed -i 's/^CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y$/# CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT is not set/' arch/arm64/configs/redbull_defconfig
          sed -i 's/^CONFIG_KSU_WITH_KPROBES=y$/# CONFIG_KSU_WITH_KPROBES is not set/' arch/arm64/configs/redbull_defconfig
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' drivers/Makefile
          echo 'Patched defconfig:'
          diff -u arch/arm64/configs/redbull_defconfig.bak arch/arm64/configs/redbull_defconfig || true

      - name: Build redbull kernel artifact
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          mkdir -p out
          make O=out redbull_defconfig
          make -j"$(nproc)" O=out

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find out/arch/arm64/boot -maxdepth 2 -type f \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) -exec cp -v {} artifacts/ \;
          cp -v arch/arm64/configs/redbull_defconfig artifacts/redbull_defconfig.nonksu || true
          ls -la artifacts

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redbull-nonksu-kernel
          path: artifacts/