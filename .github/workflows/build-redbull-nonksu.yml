name: Build redbull non-KSU kernel

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-redbull-nonksu.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd

      - name: Disable KSU in defconfig
        shell: bash
        run: |
          DEFCONFIG="arch/arm64/configs/redbull_defconfig"
          cp "$DEFCONFIG" "$DEFCONFIG.bak"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('arch/arm64/configs/redbull_defconfig')
          text = path.read_text()
          replacements = [
              ('CONFIG_KSU=y', '# CONFIG_KSU is not set'),
              ('CONFIG_KSU_SUSFS=y', '# CONFIG_KSU_SUSFS is not set'),
              ('CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y', '# CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT is not set'),
              ('CONFIG_KSU_WITH_KPROBES=y', '# CONFIG_KSU_WITH_KPROBES is not set'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)
          PY
          echo "Patched defconfig diff:"
          diff -u "$DEFCONFIG.bak" "$DEFCONFIG" || true

      - name: Build redbull kernel artifact
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          mkdir -p out
          make O=out redbull_defconfig
          make -j"$(nproc)" O=out

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find out/arch/arm64/boot -maxdepth 2 -type f \( -name 'Image*' -o -name '*.dtb' -o -name '*.dtbo' \) -exec cp -v {} artifacts/ \;
          cp -v arch/arm64/configs/redbull_defconfig artifacts/redbull_defconfig.nonksu || true
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redbull-nonksu-kernel
          path: artifacts/